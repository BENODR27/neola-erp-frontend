<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="machine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#202848" />
      <stop offset="100%" stop-color="#4B5685" />
    </linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#202848" flood-opacity=".12" />
    </filter>
    <clipPath id="cloth-window">
      <rect x="160" y="142" width="190" height="24" rx="4" />
    </clipPath>
  </defs>

  <style>
    .spool-thread {
      stroke-dasharray: 2 3;
      animation: thread-run .8s linear infinite;
    }
    .handwheel {
      transform-box: view-box;
      transform-origin: 275px 110px;
      animation: wheel-turn .7s linear infinite;
    }
    .needle-bar {
      transform-box: view-box;
      transform-origin: 207px 114px;
      animation: needle-sew .3s ease-in-out infinite alternate;
    }
    .cloth-feed {
      animation: fabric-feed 1.6s linear infinite;
    }
    .stitches {
      stroke-dasharray: 5 5;
      animation: stitch-feed .45s linear infinite;
    }
    .load-one { animation: load-dot 1s ease-in-out infinite; }
    .load-two { animation: load-dot 1s .16s ease-in-out infinite; }
    .load-three { animation: load-dot 1s .32s ease-in-out infinite; }

    @keyframes thread-run {
      to { stroke-dashoffset: -10; }
    }
    @keyframes wheel-turn {
      to { transform: rotate(360deg); }
    }
    @keyframes needle-sew {
      from { transform: translateY(-2px); }
      to { transform: translateY(4px); }
    }
    @keyframes fabric-feed {
      from { transform: translateX(0); }
      to { transform: translateX(-44px); }
    }
    @keyframes stitch-feed {
      to { stroke-dashoffset: -10; }
    }
    @keyframes load-dot {
      0%, 100% { opacity: .25; }
      50% { opacity: 1; }
    }
  </style>

  <rect x="20" y="18" width="360" height="214" rx="22" fill="#F8FAFC" filter="url(#shadow)" />

  <g fill="#E0E7FF" stroke="#D2DAF5" stroke-width="1">
    <circle cx="82" cy="62" r="17" />
    <circle cx="318" cy="62" r="17" />
    <circle cx="82" cy="184" r="17" />
    <circle cx="318" cy="184" r="17" />
  </g>

  <g fill="none" stroke="#39446F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74 63c0-5 4-8 8-8s8 3 8 8-4 8-8 8-8-3-8-8zm4-11h8m-8 22h8m-4-19v16" />
    <path d="m311 62 5 5 9-11m-15 13h15" />
    <path d="M75 180h14v10H75zm2-4h10v4H77zm2 8h6m-5 4v2m4-2v2" />
    <path d="M311 178v13m0-13h7a5 5 0 0 1 0 10h-7m0-5 9 9" />
  </g>

  <ellipse cx="202" cy="173" rx="101" ry="7" fill="#202848" opacity=".07" />

  <g>
    <path
      d="M143 51h102c12 0 20 8 20 20v14h-48v27h-15v33h-37v-36h-15c-17 0-26-10-26-26 0-20 6-32 19-32z"
      fill="url(#machine)"
    />
    <path d="M155 62h78v8h-78z" fill="#fff" opacity=".09" />
    <path d="M153 80h18m-18 8h18m-18 8h14" stroke="#C7D2FE" stroke-width="2" stroke-linecap="round" opacity=".7" />
    <rect x="182" y="56" width="29" height="5" rx="2.5" fill="#818CF8" />
    <circle cx="184" cy="75" r="3" fill="#A5B4FC" />
    <circle cx="195" cy="75" r="3" fill="#A5B4FC" opacity=".7" />
    <rect x="206" y="92" width="36" height="20" rx="3" fill="#202848" opacity=".4" />
    <path d="M210 97h28m-28 5h18" stroke="#CBD5E1" stroke-width="1.5" opacity=".75" />
  </g>

  <g>
    <rect x="174" y="37" width="18" height="7" rx="2" fill="#818CF8" />
    <rect x="178" y="30" width="10" height="9" rx="2" fill="#A5B4FC" />
    <path class="spool-thread" d="M183 37v8q0 5 7 5h17v62" fill="none" stroke="#818CF8" stroke-width="2" />
  </g>

  <g class="handwheel" fill="none" stroke="#A5B4FC" stroke-width="3">
    <circle cx="275" cy="110" r="17" />
    <circle cx="275" cy="110" r="4" fill="#818CF8" />
    <path d="M275 93v13m12 4h-8m-4 17v-13m-12-4h8" />
  </g>

  <path d="M211 112v26" stroke="#DCE6FF" stroke-width="4" stroke-linecap="round" />
  <g class="needle-bar">
    <path d="M207 106v35" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round" />
    <path d="M201 139h12l-2 4h-8z" fill="#A5B4FC" />
  </g>

  <path d="M90 155h220" stroke="#39446F" stroke-width="7" stroke-linecap="round" />
  <path d="M113 160v9m176-9v9" stroke="#39446F" stroke-width="5" stroke-linecap="round" />
  <rect x="160" y="142" width="190" height="24" rx="4" fill="url(#fabric)" />
  <g clip-path="url(#cloth-window)">
    <g class="cloth-feed">
      <path d="M160 142v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24m11-24v24" stroke="#fff" stroke-width=".6" opacity=".22" />
    </g>
    <path class="stitches" d="M166 154h180" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <text x="200" y="199" text-anchor="middle" fill="#202848" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    Sewing in progress
  </text>
  <text x="175" y="218" text-anchor="middle" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    Preparing your workspace
  </text>
  <circle class="load-one" cx="254" cy="214" r="2.5" fill="#4B4F87" />
  <circle class="load-two" cx="264" cy="214" r="2.5" fill="#4B4F87" />
  <circle class="load-three" cx="274" cy="214" r="2.5" fill="#4B4F87" />
</svg>
