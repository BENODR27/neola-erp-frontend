<div class="record-editor-backdrop" *ngIf="open" (click)="closed.emit()"><section class="record-editor" role="dialog" aria-modal="true" (click)="$event.stopPropagation()"><header class="record-editor-header"><div><span class="editor-kicker">MMMS RECORD</span><h2>{{ editingId ? 'Edit' : 'Add' }} {{ title }}</h2><p>Capture maintenance information in a guided form.</p></div><button type="button" class="editor-close" (click)="closed.emit()" aria-label="Close"><i class="bi bi-x-lg"></i></button></header><form class="record-form" (ngSubmit)="saved.emit()"><div class="editor-error" *ngIf="error"><i class="bi bi-exclamation-circle"></i>{{ error }}</div>
<div class="form-grid" *ngIf="module === 'machines'"><label>Machine code<input name="machineCode" [(ngModel)]="draft['machineCode']" required placeholder="e.g. M-1042" /></label><label>Asset number<input name="assetNumber" [(ngModel)]="draft['assetNumber']" required placeholder="e.g. AST-1042" /></label><label>Machine name<input name="name" [(ngModel)]="draft['name']" required placeholder="e.g. Juki DDL-9000C" /></label><label>Description<textarea name="description" [(ngModel)]="draft['description']"></textarea></label><label>Category<input name="category" [(ngModel)]="draft['category']" required /></label><label>Subcategory<input name="subcategory" [(ngModel)]="draft['subcategory']" /></label><label>Manufacturer<input name="manufacturer" [(ngModel)]="draft['manufacturer']" /></label><label>Brand<input name="brand" [(ngModel)]="draft['brand']" /></label><label>Model number<input name="modelNumber" [(ngModel)]="draft['modelNumber']" /></label><label>Serial number<input name="serialNumber" [(ngModel)]="draft['serialNumber']" /></label><label>Factory / location<input name="factoryLocation" [(ngModel)]="draft['factoryLocation']" /></label><label>Production line<input name="line" [(ngModel)]="draft['line']" required /></label><label>Installation date<input name="installationDate" type="date" [(ngModel)]="draft['installationDate']" /></label><label>Purchase date<input name="purchaseDate" type="date" [(ngModel)]="draft['purchaseDate']" /></label><label>Purchase cost<input name="purchaseCost" type="number" min="0" step="0.01" [(ngModel)]="draft['purchaseCost']" /></label><label>Warranty expiry<input name="warrantyExpiryDate" type="date" [(ngModel)]="draft['warrantyExpiryDate']" /></label><label>Criticality<select name="criticality" [(ngModel)]="draft['criticality']"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></label><label>Lifecycle condition<select name="lifecycleCondition" [(ngModel)]="draft['lifecycleCondition']"><option>Operational</option><option>Needs Attention</option><option>End of Life</option></select></label><label>Status<select name="status" [(ngModel)]="draft['status']"><option>Running</option><option>Idle</option><option>Under Maintenance</option><option>Breakdown</option><option>Reserved</option><option>Decommissioned</option><option>Scrapped</option></select></label><label>Uptime (%)<input name="uptime" type="number" min="0" max="100" [(ngModel)]="draft['uptime']" /></label><label>Last service<input name="lastService" [(ngModel)]="draft['lastService']" /></label></div>
<div class="form-grid" *ngIf="module === 'work-orders'"><label>Issue<input name="issue" [(ngModel)]="draft['issue']" required placeholder="Describe the work required" /></label><label>Machine<select name="machine" [(ngModel)]="draft['machine']" required><option value="">Select a machine</option><option *ngFor="let machine of machineOptions" [ngValue]="machine.id + ' · ' + machine.name">{{ machine.id }} · {{ machine.name }}</option></select></label><label>Technician<select name="technicianId" [ngModel]="draft['technicianId'] || ''" (ngModelChange)="technicianChanged($event)"><option value="">Unassigned</option><option *ngFor="let technician of technicianOptions" [ngValue]="technician.id">{{ technician.name }} · {{ technician.employeeNumber }}</option></select></label><label>Priority<select name="priority" [(ngModel)]="draft['priority']"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></label><label>Status<select name="status" [(ngModel)]="draft['status']"><option>Open</option><option>Assigned</option><option>In Progress</option><option>Waiting Parts</option><option>Repair Completed</option><option>Verification</option><option>Completed</option><option>Closed</option></select></label><label>Due date<input name="due" [(ngModel)]="draft['due']" /></label><label>Diagnosis<textarea name="diagnosis" [(ngModel)]="draft['diagnosis']"></textarea></label><label>Repair notes<textarea name="repairNotes" [(ngModel)]="draft['repairNotes']"></textarea></label><label>Completion notes<textarea name="completionNotes" [(ngModel)]="draft['completionNotes']"></textarea></label><label>Verification notes<textarea name="verificationNotes" [(ngModel)]="draft['verificationNotes']"></textarea></label><label>Labor minutes<input name="laborMinutes" type="number" min="0" [(ngModel)]="draft['laborMinutes']" /></label></div>
<div class="form-grid" *ngIf="module === 'preventive-maintenance'"><label>Machine<select name="machine" [(ngModel)]="draft['machine']" required><option value="">Select a machine</option><option *ngFor="let machine of machineOptions" [ngValue]="machine.id + ' · ' + machine.name">{{ machine.id }} · {{ machine.name }}</option></select></label><label>Task<input name="task" [(ngModel)]="draft['task']" required /></label><label>Frequency<select name="frequency" [(ngModel)]="draft['frequency']"><option>Daily</option><option>Weekly</option><option>Monthly</option><option>Quarterly</option></select></label><label>Next due<input name="nextDue" [(ngModel)]="draft['nextDue']" /></label><label>Owner<input name="owner" [(ngModel)]="draft['owner']" /></label><label>Compliance (%)<input name="compliance" type="number" min="0" max="100" [(ngModel)]="draft['compliance']" /></label></div>
<div class="form-grid" *ngIf="module === 'breakdowns'"><label>Machine<select name="machine" [(ngModel)]="draft['machine']" required><option value="">Select a machine</option><option *ngFor="let machine of machineOptions" [ngValue]="machine.id + ' · ' + machine.name">{{ machine.id }} · {{ machine.name }}</option></select></label><label>Category<input name="category" [(ngModel)]="draft['category']" /></label><label>Started<input name="startedAt" [(ngModel)]="draft['startedAt']" /></label><label>Downtime<input name="downtime" [(ngModel)]="draft['downtime']" /></label><label>Root cause<input name="rootCause" [(ngModel)]="draft['rootCause']" /></label><label>Status<select name="status" [(ngModel)]="draft['status']"><option>Open</option><option>Investigating</option><option>Resolved</option></select></label></div>
<div class="form-grid" *ngIf="module === 'spare-parts'"><label>Part name<input name="name" [(ngModel)]="draft['name']" required /></label><label>Category<input name="category" [(ngModel)]="draft['category']" /></label><label>Supplier<input name="supplier" [(ngModel)]="draft['supplier']" /></label><label>Stock on hand<input name="stock" type="number" min="0" [(ngModel)]="draft['stock']" /></label><label>Reorder level<input name="reorderLevel" type="number" min="0" [(ngModel)]="draft['reorderLevel']" /></label><label>Unit cost<input name="unitCost" [(ngModel)]="draft['unitCost']" /></label></div>
<div class="form-grid" *ngIf="module === 'costs'"><label>Machine<input name="machine" [(ngModel)]="draft['machine']" required /></label><label>Labor<input name="labor" [(ngModel)]="draft['labor']" /></label><label>Spare parts<input name="spareParts" [(ngModel)]="draft['spareParts']" /></label><label>Contractors<input name="contractors" [(ngModel)]="draft['contractors']" /></label><label>Total<input name="total" [(ngModel)]="draft['total']" /></label><label>Trend<select name="trend" [(ngModel)]="draft['trend']"><option value="down">Improving</option><option value="up">Rising</option></select></label></div>
<div class="form-grid" *ngIf="module === 'mobile'"><label>Machine<input name="machine" [(ngModel)]="draft['machine']" required /></label><label>Task<input name="task" [(ngModel)]="draft['task']" required /></label><label>Priority<select name="priority" [(ngModel)]="draft['priority']"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></label><label>Assignee<input name="assignee" [(ngModel)]="draft['assignee']" /></label><label>Sync status<select name="sync" [(ngModel)]="draft['sync']"><option>Synced</option><option>Pending sync</option><option>Offline</option></select></label></div>
<div class="form-grid" *ngIf="module === 'qr-management'"><label>Machine<input name="machine" [(ngModel)]="draft['machine']" required /></label><label>Asset number<input name="assetNumber" [(ngModel)]="draft['assetNumber']" required /></label><label>Last scan<input name="lastScan" [(ngModel)]="draft['lastScan']" /></label><label>Open work orders<input name="openOrders" type="number" min="0" [(ngModel)]="draft['openOrders']" /></label><label>Breakdown records<input name="breakdowns" type="number" min="0" [(ngModel)]="draft['breakdowns']" /></label><label>Status<select name="status" [(ngModel)]="draft['status']"><option>Running</option><option>Idle</option><option>Attention</option></select></label></div>
<div class="form-grid" *ngIf="module === 'production-integration'"><label>Production order<input name="order" [(ngModel)]="draft['order']" required /></label><label>Line<input name="line" [(ngModel)]="draft['line']" /></label><label>Machine<input name="machine" [(ngModel)]="draft['machine']" /></label><label>Downtime<input name="downtime" [(ngModel)]="draft['downtime']" /></label><label>Units at risk<input name="unitsAtRisk" type="number" min="0" [(ngModel)]="draft['unitsAtRisk']" /></label><label>Recovery<select name="recovery" [(ngModel)]="draft['recovery']"><option>On track</option><option>At risk</option><option>Delayed</option></select></label></div>
<div class="form-grid" *ngIf="module === 'technicians'"><label>Employee number<input name="employeeNumber" [(ngModel)]="draft['employeeNumber']" required placeholder="e.g. EMP-1048" /></label><label>Full name<input name="name" [(ngModel)]="draft['name']" required /></label><label>Skill categories<input name="skills" [(ngModel)]="draft['skills']" required placeholder="Mechanical, Electrical" /></label><label>Shift<select name="shift" [(ngModel)]="draft['shift']"><option>Day</option><option>Night</option><option>Rotating</option></select></label><label>Factory<input name="factory" [(ngModel)]="draft['factory']" required /></label><label>Availability<select name="availability" [(ngModel)]="draft['availability']"><option>Available</option><option>Busy</option><option>Unavailable</option></select></label><label>Active<select name="active" [(ngModel)]="draft['active']"><option value="true">Active</option><option value="false">Inactive</option></select></label><label>Current workload<input name="workload" type="number" min="0" [(ngModel)]="draft['workload']" /></label><label>Email<input name="email" type="email" [(ngModel)]="draft['email']" /></label><label>Phone<input name="phone" [(ngModel)]="draft['phone']" /></label></div>
<footer class="record-editor-footer"><button type="button" class="secondary-action" (click)="closed.emit()">Cancel</button><button type="submit" class="primary-action"><i class="bi bi-check-lg"></i> Save record</button></footer></form></section></div>
