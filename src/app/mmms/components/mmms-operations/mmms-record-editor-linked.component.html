<div class="record-editor-backdrop" *ngIf="open" (click)="closed.emit()">
  <section class="record-editor" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <header class="record-editor-header"><div><span class="editor-kicker">MMMS RECORD</span><h2>{{ editingId ? 'Edit' : 'Add' }} {{ title }}</h2><p>Select related records from the live master data.</p></div><button type="button" class="editor-close" (click)="closed.emit()"><i class="bi bi-x-lg"></i></button></header>
    <form class="record-form" (ngSubmit)="saved.emit()"><div class="editor-error" *ngIf="error"><i class="bi bi-exclamation-circle"></i>{{ error }}</div>
      <div class="form-grid" *ngIf="module === 'machines'"><label>Machine code<input name="machineCode" [(ngModel)]="draft['machineCode']" required /></label><label>Asset number<input name="assetNumber" [(ngModel)]="draft['assetNumber']" required /></label><label>Machine name<input name="name" [(ngModel)]="draft['name']" required /></label><label>Category<input class="relation-search" placeholder="Search category" [value]="relationSearch['category'] || ''" (input)="updateRelationSearch('category',$any($event.target).value)"><select name="category" [(ngModel)]="draft['category']" (ngModelChange)="masterChanged('category',$event)" required><option value="">Select category</option><option *ngFor="let item of filterOptions(categoryOptions,'category')" [ngValue]="item.name">{{ item.code ? item.code + ' · ' : '' }}{{ item.name }}</option></select></label><label>Factory<input class="relation-search" placeholder="Search factory" [value]="relationSearch['factoryLocation'] || ''" (input)="updateRelationSearch('factoryLocation',$any($event.target).value)"><select name="factoryLocation" [(ngModel)]="draft['factoryLocation']" (ngModelChange)="masterChanged('factoryLocation',$event)" required><option value="">Select factory</option><option *ngFor="let item of filterOptions(factoryOptions,'factoryLocation')" [ngValue]="item.name">{{ item.code ? item.code + ' · ' : '' }}{{ item.name }}</option></select></label><label>Production line<input class="relation-search" placeholder="Search line" [value]="relationSearch['line'] || ''" (input)="updateRelationSearch('line',$any($event.target).value)"><select name="line" [(ngModel)]="draft['line']" (ngModelChange)="masterChanged('line',$event)"><option value="">Select line</option><option *ngFor="let item of filterOptions(lineOptions,'line')" [ngValue]="item.name">{{ item.code ? item.code + ' · ' : '' }}{{ item.name }}</option></select></label><label>Description<textarea name="description" [(ngModel)]="draft['description']"></textarea></label><label>Manufacturer<input name="manufacturer" [(ngModel)]="draft['manufacturer']" /></label><label>Brand<input name="brand" [(ngModel)]="draft['brand']" /></label><label>Model number<input name="modelNumber" [(ngModel)]="draft['modelNumber']" /></label><label>Serial number<input name="serialNumber" [(ngModel)]="draft['serialNumber']" /></label><label>Installation date<input name="installationDate" type="date" [(ngModel)]="draft['installationDate']" /></label><label>Purchase cost<input name="purchaseCost" type="number" min="0" [(ngModel)]="draft['purchaseCost']" /></label><label>Criticality<select name="criticality" [(ngModel)]="draft['criticality']"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></label><label>Status<select name="status" [(ngModel)]="draft['status']"><option>Running</option><option>Idle</option><option>Under Maintenance</option><option>Breakdown</option><option>Reserved</option><option>Decommissioned</option></select></label></div>
      <div class="form-grid" *ngIf="module === 'work-orders' || module === 'preventive-maintenance' || module === 'breakdowns'"><label>Machine<input class="relation-search" placeholder="Search machine" [value]="relationSearch['machine'] || ''" (input)="updateRelationSearch('machine',$any($event.target).value)"><select name="machine" [(ngModel)]="draft['machine']" (ngModelChange)="machineChanged($event)" required><option value="">Select machine</option><option *ngFor="let item of filterOptions(machineOptions,'machine')" [ngValue]="item.id + ' · ' + item.name">{{ item.id }} · {{ item.name }}</option></select></label><label *ngIf="module === 'work-orders'">Issue<input name="issue" [(ngModel)]="draft['issue']" required /></label><label *ngIf="module === 'work-orders'">Technician<input class="relation-search" placeholder="Search technician" [value]="relationSearch['technician'] || ''" (input)="updateRelationSearch('technician',$any($event.target).value)"><select name="technicianId" [ngModel]="draft['technicianId'] || ''" (ngModelChange)="technicianChanged($event)"><option value="">Unassigned</option><option *ngFor="let item of filterOptions(technicianOptions,'technician')" [ngValue]="item.id">{{ item.name }} · {{ item.employeeNumber }}</option></select></label><label *ngIf="module === 'preventive-maintenance'">Task<input name="task" [(ngModel)]="draft['task']" required /></label><label *ngIf="module === 'preventive-maintenance'">Owner<select name="owner" [(ngModel)]="draft['owner']"><option value="">Unassigned</option><option *ngFor="let item of technicianOptions" [ngValue]="item.name">{{ item.name }} · {{ item.employeeNumber }}</option></select></label><label *ngIf="module === 'breakdowns'">Category<select name="category" [(ngModel)]="draft['category']"><option value="">Select category</option><option *ngFor="let item of categoryOptions" [ngValue]="item.name">{{ item.name }}</option></select></label><label *ngIf="module === 'breakdowns'">Root cause<input name="rootCause" [(ngModel)]="draft['rootCause']" /></label><label *ngIf="module === 'work-orders'">Priority<select name="priority" [(ngModel)]="draft['priority']"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></label><label *ngIf="module === 'work-orders'">Status<select name="status" [(ngModel)]="draft['status']"><option>Open</option><option>Assigned</option><option>In Progress</option><option>Waiting Parts</option><option>Repair Completed</option><option>Verification</option><option>Completed</option><option>Closed</option></select></label><label *ngIf="module === 'preventive-maintenance'">Frequency<select name="frequency" [(ngModel)]="draft['frequency']"><option>Daily</option><option>Weekly</option><option>Monthly</option><option>Quarterly</option></select></label><label *ngIf="module === 'preventive-maintenance'">Next due<input name="nextDue" type="date" [(ngModel)]="draft['nextDue']" /></label><label *ngIf="module === 'breakdowns'">Started<input name="startedAt" type="datetime-local" [(ngModel)]="draft['startedAt']" /></label><label *ngIf="module === 'breakdowns'">Status<select name="status" [(ngModel)]="draft['status']"><option>Open</option><option>Investigating</option><option>Resolved</option></select></label><label *ngIf="module === 'work-orders'">Diagnosis<textarea name="diagnosis" [(ngModel)]="draft['diagnosis']"></textarea></label><label *ngIf="module === 'work-orders'">Repair notes<textarea name="repairNotes" [(ngModel)]="draft['repairNotes']"></textarea></label><label *ngIf="module === 'work-orders'">Completion notes<textarea name="completionNotes" [(ngModel)]="draft['completionNotes']"></textarea></label></div>
      <div class="form-grid" *ngIf="module === 'spare-parts'"><label>Part name<input name="name" [(ngModel)]="draft['name']" required /></label><label>Category<select name="category" [(ngModel)]="draft['category']"><option value="">Select category</option><option *ngFor="let item of categoryOptions" [ngValue]="item.name">{{ item.name }}</option></select></label><label>Vendor<select name="supplier" [(ngModel)]="draft['supplier']"><option value="">Select vendor</option><option *ngFor="let item of vendorOptions" [ngValue]="item.name">{{ item.name }}</option></select></label><label>Stock on hand<input name="stock" type="number" min="0" [(ngModel)]="draft['stock']" /></label><label>Reorder level<input name="reorderLevel" type="number" min="0" [(ngModel)]="draft['reorderLevel']" /></label><label>Unit cost<input name="unitCost" type="number" min="0" [(ngModel)]="draft['unitCost']" /></label></div>
      <div class="form-grid" *ngIf="module === 'mobile' || module === 'qr-management'"><label>Machine<select name="machine" [(ngModel)]="draft['machine']" (ngModelChange)="machineChanged($event)" required><option value="">Select machine</option><option *ngFor="let item of machineOptions" [ngValue]="item.id + ' · ' + item.name">{{ item.id }} · {{ item.name }}</option></select></label><label *ngIf="module === 'mobile'">Task<input name="task" [(ngModel)]="draft['task']" required /></label><label *ngIf="module === 'mobile'">Assignee<select name="assignee" [(ngModel)]="draft['assignee']"><option value="">Unassigned</option><option *ngFor="let item of technicianOptions" [ngValue]="item.name">{{ item.name }}</option></select></label><label *ngIf="module === 'qr-management'">Asset number<input name="assetNumber" [(ngModel)]="draft['assetNumber']" required /></label><label *ngIf="module === 'mobile'">Priority<select name="priority" [(ngModel)]="draft['priority']"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></label><label *ngIf="module === 'qr-management'">Status<select name="status" [(ngModel)]="draft['status']"><option>Running</option><option>Idle</option><option>Attention</option></select></label></div>
      <div class="form-grid" *ngIf="module === 'production-integration'"><label>Production order<input name="order" [(ngModel)]="draft['order']" required /></label><label>Line<select name="line" [(ngModel)]="draft['line']"><option value="">Select line</option><option *ngFor="let item of lineOptions" [ngValue]="item.name">{{ item.name }}</option></select></label><label>Machine<select name="machine" [(ngModel)]="draft['machine']" (ngModelChange)="machineChanged($event)"><option value="">Select machine</option><option *ngFor="let item of machineOptions" [ngValue]="item.id + ' · ' + item.name">{{ item.id }} · {{ item.name }}</option></select></label><label>Units at risk<input name="unitsAtRisk" type="number" min="0" [(ngModel)]="draft['unitsAtRisk']" /></label><label>Recovery<select name="recovery" [(ngModel)]="draft['recovery']"><option>On track</option><option>At risk</option><option>Delayed</option></select></label></div>
      <div class="form-grid" *ngIf="module === 'technicians'"><label>Employee number<input name="employeeNumber" [(ngModel)]="draft['employeeNumber']" required /></label><label>Full name<input name="name" [(ngModel)]="draft['name']" required /></label><label>Skill categories<input name="skills" [(ngModel)]="draft['skills']" required /></label><label>Factory<select name="factory" [(ngModel)]="draft['factory']"><option value="">Select factory</option><option *ngFor="let item of factoryOptions" [ngValue]="item.name">{{ item.name }}</option></select></label><label>Shift<select name="shift" [(ngModel)]="draft['shift']"><option>Day</option><option>Night</option><option>Rotating</option></select></label><label>Availability<select name="availability" [(ngModel)]="draft['availability']"><option>Available</option><option>Busy</option><option>Unavailable</option></select></label><label>Active<select name="active" [(ngModel)]="draft['active']"><option value="true">Active</option><option value="false">Inactive</option></select></label><label>Email<input name="email" type="email" [(ngModel)]="draft['email']" /></label><label>Phone<input name="phone" [(ngModel)]="draft['phone']" /></label></div>
      <footer class="record-editor-footer"><button type="button" class="secondary-action" (click)="closed.emit()">Cancel</button><button type="submit" class="primary-action"><i class="bi bi-check-lg"></i> Save record</button></footer>
    </form>
  </section>
</div>
