<section class="master-page">
  <header class="page-header">
    <div>
      <h1>Maintenance notifications</h1>
      <p>Assignments, overdue work, inspections, stock and warranty alerts.</p>
    </div>
    <button type="button" (click)="load()">Refresh</button>
  </header>
  <p role="alert" *ngIf="error()">{{ error() }}</p>
  <section class="table-card">
    <article *ngFor="let row of pagination.slice(rows())">
      <h2>{{ row.title }}</h2>
      <p>{{ row.event }} · {{ row.createdAt | date: 'medium' }} · {{ delivery(row) }}</p>
      <a
        *ngIf="row.workOrderId"
        routerLink="/mmms/work-orders"
        [queryParams]="{ orderId: row.workOrderId }"
        >Open work order</a
      ><button *ngIf="!row.read" type="button" (click)="markRead(row)">Mark read</button
      ><span *ngIf="row.read">Read</span>
    </article>
    <p *ngIf="!rows().length">No maintenance notifications.</p>

    <app-mmms-pagination
      [pager]="pagination"
      [total]="rows().length"
      label="Notifications"
    ></app-mmms-pagination>
  </section>
</section>
