<nav [attr.aria-label]="label + ' pagination'" class="pagination-bar">
  <span role="status" aria-live="polite"
    >{{ first() }}–{{ last() }} of {{ total }} {{ label.toLowerCase() }}</span
  >
  <label
    >Rows per page<select #size [value]="pager.pageSize()" (change)="pager.resize(+size.value)">
      <option *ngFor="let value of sizes" [value]="value" [selected]="value === pager.pageSize()">
        {{ value }}
      </option>
    </select></label
  >
  <div class="page-controls">
    <button
      type="button"
      aria-label="First page"
      (click)="go(1)"
      [disabled]="pager.currentPage(total) === 1"
    >
      <i class="bi bi-chevron-double-left" aria-hidden="true"></i>
    </button>
    <button
      type="button"
      aria-label="Previous page"
      (click)="go(pager.currentPage(total) - 1)"
      [disabled]="pager.currentPage(total) === 1"
    >
      <i class="bi bi-chevron-left" aria-hidden="true"></i>
    </button>
    <span>Page {{ pager.currentPage(total) }} of {{ pager.pageCount(total) }}</span>
    <button
      type="button"
      aria-label="Next page"
      (click)="go(pager.currentPage(total) + 1)"
      [disabled]="pager.currentPage(total) === pager.pageCount(total)"
    >
      <i class="bi bi-chevron-right" aria-hidden="true"></i>
    </button>
    <button
      type="button"
      aria-label="Last page"
      (click)="go(pager.pageCount(total))"
      [disabled]="pager.currentPage(total) === pager.pageCount(total)"
    >
      <i class="bi bi-chevron-double-right" aria-hidden="true"></i>
    </button>
  </div>
</nav>
