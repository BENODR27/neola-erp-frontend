<div class="mobile-menu d-lg-none">
  <button
    class="menu-btn"
    type="button"
    aria-label="Toggle navigation menu"
    [attr.aria-expanded]="isMobileSidebarOpen"
    (click)="toggleMobileSidebar()"
  >
    <i class="bi bi-list"></i>
  </button>
</div>

<button
  *ngIf="isMobileSidebarOpen"
  class="mobile-sidebar-backdrop"
  type="button"
  aria-label="Close navigation menu"
  (click)="isMobileSidebarOpen = false"
></button>

<div
  *ngIf="isMobileSidebarOpen"
  class="mobile-sidebar"
  role="navigation"
  aria-label="Mobile navigation"
>
  <div class="sidebar-items">
    <a
      [routerLink]="['/adminv2/welcome']"
      class="dropdown-item"
      (click)="isMobileSidebarOpen = false"
    >
      <i class="bi bi-house"></i>
      <span>Home</span>
    </a>
    <a
      [routerLink]="['/adminv2/applications']"
      class="dropdown-item"
      (click)="isMobileSidebarOpen = false"
    >
      <i class="bi bi-grid"></i>
      <span>Applications</span>
    </a>
  </div>

  <div class="sidebar-items">
    <ng-container *ngFor="let item of navbarItems()">
      <a
        [routerLink]="item.link"
        *ngIf="authService.hasPermission(item.permission)"
        (click)="isMobileSidebarOpen = false"
      >
        <i class="bi" [ngClass]="item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
    </ng-container>
    <a class="nav-link" (click)="logout(); isMobileSidebarOpen = false">
      <i class="bi bi-box-arrow-left"></i>
      <span>Sign Out</span>
    </a>
  </div>
</div>

<aside
  class="sidebar d-none d-lg-flex"
  [ngClass]="{ expanded: isExpanded }"
  aria-label="Primary navigation"
>
  <div class="sidebar-scroll">
    <p class="sidebar-section-label" [hidden]="!isExpanded">Workspace</p>
    <div class="sidebar-items">
      <ng-container *ngFor="let item of navbarItems()">
        <a
          [routerLink]="item.link"
          matTooltip="{{ item.label }}"
          *ngIf="authService.hasPermission(item.permission)"
          [matTooltipDisabled]="isExpanded"
        >
          <i class="bi" [ngClass]="item.icon"></i>
          <span class="sidebarmoblabel" [hidden]="!isExpanded">
            {{ item.label }}
          </span>
        </a>
      </ng-container>

      <a class="nav-link" (click)="logout()" matTooltip="Sign Out">
        <i class="bi bi-box-arrow-left"></i>
        <span class="sidebarmoblabel" [hidden]="!isExpanded"> Sign Out </span>
      </a>
    </div>
  </div>
</aside>
