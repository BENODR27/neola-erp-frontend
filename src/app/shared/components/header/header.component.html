<header class="header">
  <button
    class="menu-toggle"
    type="button"
    aria-label="Toggle navigation menu"
    title="Toggle navigation"
    [attr.aria-expanded]="navigationOpen"
    (click)="toggle()"
  >
    <i class="bi bi-list" aria-hidden="true"></i>
  </button>
  <a class="brand" [routerLink]="appRoutes.home" [attr.aria-label]="appConfig.shortName + ' home'"
    ><img [src]="appConfig.logo" alt="" class="brand-logo" width="42" height="42" /><span
      class="brand-wordmark"
      >{{ appConfig.name }}</span
    ></a
  >
  <div class="header-heading">
    <span class="workspace-name" [hidden]="workspaceBrand === appConfig.name">{{
      workspaceBrand
    }}</span
    ><span class="page-title">{{ pageTitle }}</span>
  </div>
  <app-second-navbar></app-second-navbar>
  <div class="profile-control">
    <button
      class="profile-toggle"
      type="button"
      aria-label="Open profile menu"
      title="Profile and appearance"
      [attr.aria-expanded]="isProfileMenuOpen()"
      aria-haspopup="true"
      (click)="toggleProfileMenu()"
    >
      <i class="bi bi-person-circle" aria-hidden="true"></i
      ><span class="profile-name">{{ currentEmpName() || 'My account' }}</span
      ><i class="bi bi-chevron-down profile-chevron" aria-hidden="true"></i>
    </button>
    <div
      class="profile-menu"
      [hidden]="!isProfileMenuOpen()"
      role="menu"
      aria-label="Profile options"
    >
      <a
        class="profile-menu-item"
        role="menuitem"
        routerLink="/appearance"
        (click)="isProfileMenuOpen.set(false)"
        ><i class="bi bi-palette" aria-hidden="true"></i><span>Appearance</span></a
      >
      <button type="button" class="profile-menu-item sign-out" role="menuitem" (click)="logout()">
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Sign out</span>
      </button>
    </div>
  </div>
</header>
