<div class="container-scroller">

          <span class="icon-menu"></span>
        </button>
      </div>
      <div>
        <a class="navbar-brand brand-logo" href="/">
          <img [src]="appConfig.logo" [alt]="appConfig.name" />

        <a class="navbar-brand brand-logo-mini" href="/">
          <img [src]="appConfig.logoCompact" [alt]="appConfig.name" />
        </a>

    <div class="navbar-menu-wrapper d-flex align-items-top">
      <ul class="navbar-nav">

      <ul class="navbar-nav ms-auto">

            aria-expanded="false"
          >
            <i class="mdi mdi-menu"></i>
          </a>

          <div
            class="dropdown-menu dropdown-menu-right navbar-dropdown preview-list p-2"
            aria-labelledby="countDropdown"

            <a class="dropdown-item preview-item p-2" [routerLink]="['/wms/fabric/receive']">
              <i class="mdi mdi-basket-fill menu-icon"></i>

            </a>

            <a class="dropdown-item preview-item p-2" [routerLink]="['/wms/allocate/bin']">

              <span class="menu-title">Allocate bin</span>
            </a>

            <a class="dropdown-item preview-item p-2" [routerLink]="['/wms/allocate/toinspection']">
              <i class="mdi mdi-basket-fill menu-icon"></i>
              <span class="menu-title">Allocate To Inspection</span>
            </a>

            <a class="dropdown-item preview-item p-2" [routerLink]="['/wms/fabric/inspection']">
              <i class="mdi mdi-content-cut menu-icon"></i>
              <span class="menu-title">Inspection</span>
            </a>

            <a class="dropdown-item preview-item p-2" [routerLink]="['/wms/issue']">
              <i class="mdi mdi-factory menu-icon"></i>
              <span class="menu-title">Issue Fabric</span>

            <a
              class="dropdown-item preview-item p-2"

            </a>

        <li class="nav-item dropdown user-dropdown">
          <a

            id="UserDropdown"
            href="#"
            data-bs-toggle="dropdown"
            aria-expanded="false"

          <div

            aria-labelledby="UserDropdown"

              <img class="img-md rounded-circle" src="images/faces/face8.jpg" alt="Profile image" />

              <p class="fw-light text-muted mb-0">Hello world</p>

            <a class="dropdown-item"

              Activity</a
            >
            <a class="dropdown-item"
              ><i class="dropdown-item-icon mdi mdi-help-circle-outline text-primary me-2"></i>
              FAQ</a

            <a class="dropdown-item"
              ><i class="dropdown-item-icon mdi mdi-power text-primary me-2"></i>Sign Out</a
            >
