map $http_upgrade $connection_upgrade {
 default upgrade;
 '' close;
}
server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 550m;
 # Resolve upstreams on requests, so this frontend starts independently of APIs.
 resolver 127.0.0.11 valid=30s ipv6=off;
 set $iam_upstream "${IAM_UPSTREAM}";
 set $mmms_upstream "${MMMS_UPSTREAM}";
 set $storage_upstream "${STORAGE_UPSTREAM}";
 proxy_ssl_server_name on;
 location = /health { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
 location /v3/ {
  proxy_pass $iam_upstream;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;
 }
 location /v1/ { proxy_pass $mmms_upstream; proxy_set_header Host $host; proxy_read_timeout 120s; }
 location /api/ss/ { proxy_pass $storage_upstream; proxy_set_header Host $host; proxy_read_timeout 120s; }
 location = /index.html { add_header Cache-Control "no-store" always; }
 location / { try_files $uri $uri/ /index.html; }
}
