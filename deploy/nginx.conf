map $http_upgrade $connection_upgrade {
 default upgrade;
 '' close;
}
server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 550m;
 location = /health { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
 location /v3/ {
  proxy_pass http://iam:7001;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;
 }
 location /v1/ { proxy_pass http://mmms:7010; proxy_set_header Host $host; proxy_read_timeout 120s; }
 location /api/ss/ { proxy_pass http://storage:3052; proxy_set_header Host $host; proxy_read_timeout 120s; }
 location = /index.html { add_header Cache-Control "no-store" always; }
 location / { try_files $uri $uri/ /index.html; }
}
